<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <style>
      @font-face {
        font-family: 'Roboto';
        src: url('{{ font_url }}');
      }

      {{ pygments_css | safe }}

      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        line-height: 1.6;
        color: #111;
      }

      pre {
        background: #f5f5f5;
        padding: 12px;
        overflow-x: auto;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      table,
      th,
      td {
        border: 1px solid #ccc;
      }

      th,
      td {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    {{ content | safe }}
  </body>
</html>
