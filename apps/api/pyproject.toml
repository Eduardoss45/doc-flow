[project]
name = "api"
version = "2.0.0"
description = "Docflow Dependencies"
authors = [
    {name = "Eduardo", email = "santos934510@gmail.com"}
]
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.1,<2.0.0)",
    "celery[redis] (>=5.6.2,<6.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)"
]

[tool.poetry.group.api.dependencies]
flask = ">=3.1.2,<4.0.0"
flask-limiter = ">=4.1.1,<5.0.0"
flask-cors = ">=6.0.2,<7.0.0"
flask-socketio = ">=5.6.0,<6.0.0"
flask-smorest = ">=0.46.2,<0.47.0"
marshmallow = ">=4.2.2,<5.0.0"
gunicorn = ">=23.0.0,<24.0.0"
eventlet = ">=0.37.0,<1.0.0"

[tool.poetry.group.worker.dependencies]
pandas = ">=3.0.0,<4.0.0"
fpdf2 = ">=2.8.5,<3.0.0"
pdfplumber = ">=0.11.9,<0.12.0"
markitdown = { version = ">=0.1.4,<0.2.0", extras = ["docx"] }
openpyxl = ">=3.1.5,<4.0.0"
markdown-it-py = ">=4.2.0,<5.0.0"
pygments = ">=2.20.0,<3.0.0"
playwright = ">=1.60.0,<2.0.0"
bleach = ">=6.3.0,<7.0.0"
beautifulsoup4 = ">=4.14.3,<5.0.0"
requests = ">=2.34.2,<3.0.0"
jinja2 = ">=3.1.6,<4.0.0"
linkify-it-py = ">=2.1.0,<3.0.0"

[tool.poetry]
packages = [{include = "app", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start-api = "src.app.entrypoints.api:main"
start-worker = "src.app.entrypoints.worker:main"