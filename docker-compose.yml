services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-df_document_processor_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5000:5432'
    networks:
      - appnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.10.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - appnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
      - rabbitmq_log:/var/log/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - appnet
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    command:
      [
        'poetry',
        'run',
        'gunicorn',
        '--worker-class',
        'eventlet',
        '-w',
        '1',
        '--bind',
        '0.0.0.0:4000',
        '--timeout',
        '120',
        'src.app.entrypoints.wsgi:app',
      ]
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - storage:/app/src/app/infra/storage
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appnet

  celery:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: beat
    command: poetry run celery -A src.app.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - storage:/app/src/app/infra/storage
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appnet

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    command: poetry run start-worker
    shm_size: '1gb'
    mem_limit: 2g
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      ALLOWED_IMAGE_DOMAINS: raw.githubusercontent.com,githubusercontent.com,cdn.jsdelivr.net,images.unsplash.com
      ALLOWED_IMAGE_TYPES: image/png,image/jpeg,image/webp,image/gif
      MAX_IMAGE_SIZE: '5242880'
      MAX_MARKDOWN_SIZE: '5242880'
      MAX_MARKDOWN_LINES: '20000'
      MAX_MARKDOWN_IMAGES: '20'
      MAX_RENDERED_HTML_SIZE: '5242880'
      MAX_HTML_NODES: '50000'
      MARKDOWN_PDF_DEBUG_HTML: 'false'
    volumes:
      - storage:/app/src/app/infra/storage
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appnet

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    command: npm run start
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet

volumes:
  pgdata:
  rabbitmq_data:
  rabbitmq_log:
  storage:

networks:
  appnet:
    driver: bridge
